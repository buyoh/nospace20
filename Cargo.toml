[package]
name = "nospace20"
version = "0.1.0"
authors = ["buyoh <mai@ukibune.net>"]
edition = "2018"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:unicode-width"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen"]

[[bin]]
name = "nospace20"
path = "src/bin/nospace20.rs"
required-features = ["cli"]

[[bin]]
name = "whitespace20"
path = "src/bin/whitespace20.rs"
required-features = ["cli"]

[[example]]
name = "ws_profiler"
required-features = ["cli"]

[dependencies]
assert_matches = "1.5.0"
clap = { version = "4.0", features = ["derive"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.64"
unicode-width = { version = "0.1.8", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[dev-dependencies]
tempfile = "3.0"
serde_yaml = "0.9"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# WASM サイズ最適化設定
[profile.release]
opt-level = "z"     # サイズ最適化優先
lto = true          # Link Time Optimization 有効化
codegen-units = 1   # 並列コンパイル無効（最適化優先）
strip = true        # デバッグシンボル除去
panic = "abort"     # パニックハンドラのコード削減
