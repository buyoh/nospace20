name: deploy-web

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          # checkout のトークンを .git/config に残さない（ビルド中の外部コードから読ませない）
          persist-credentials: false
      - name: Version
        run: rustup --version ; rustc --version ; cargo --version
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: bash tools/ci/deploy-webstatic-to-git.sh build
      - name: Push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: bash tools/ci/deploy-webstatic-to-git.sh push
