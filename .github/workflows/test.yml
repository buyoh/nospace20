name: cargo-test

on: [push]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup
        run: |
          git config --global user.email "15198247+buyoh@users.noreply.github.com"
          git config --global user.name "buyoh(workflow)"
      - name: Version
        run: rustup --version ; rustc --version ; cargo --version
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Run tests (wasm feature)
        run: cargo test --verbose --features wasm --lib wasm_api
      - name: Build wasm32
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --verbose --target wasm32-unknown-unknown --no-default-features --features wasm
      - name: Check formatting
        run: cargo fmt --check
      - name: Run tests2
        run: |
          bash tools/setup-wsc.sh
          cargo test -- --ignored
