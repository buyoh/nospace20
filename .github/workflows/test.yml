name: cargo-test

on: [push]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
      - name: Setup
        run: |
          git config --global user.email "15198247+buyoh@users.noreply.github.com"
          git config --global user.name "buyoh(workflow)"
      - name: Version
        run: rustup --version ; rustc --version ; cargo --version
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Run tests2
        run: |
          bash tools/setup-wsc.sh
          cargo test -- --ignored
