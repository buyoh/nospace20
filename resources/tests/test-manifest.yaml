# nospace20 Test Manifest
# このファイルで定義されたテストケースは build.rs によって自動的にテストコードとして生成されます
#
# フィールド:
#   name: テスト関数名
#   type: success | success_io | syntax_error
#   path: テストファイルのパス（resources/tests/passes/ または fails/syntax/ からの相対パス）
#   comment: (オプション) テストの説明
#   exclude_targets: (オプション) 除外するテスト対象 [whitespace, whitespace-self, whitespace-self-strict, whitespace-self-randomize, whitespace-self-opt-all] デフォルトは全ターゲット

