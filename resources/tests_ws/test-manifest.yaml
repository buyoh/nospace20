# Whitespace Interpreter Direct Test Manifest
tests:
  # Stack manipulation
  - name: test_ws_stack_push_positive_001
    type: ws_io
    path: stack/push_positive_001
    comment: "Push positive number and output"

  - name: test_ws_stack_push_negative_001
    type: ws_io
    path: stack/push_negative_001
    comment: "Push negative number (-3) and output"

  - name: test_ws_stack_push_negative_002
    type: ws_io
    path: stack/push_negative_002
    comment: "Push negative number (-1) and output"

  - name: test_ws_stack_push_negative_003
    type: ws_io
    path: stack/push_negative_003
    comment: "Push negative number (-42) and output"

  - name: test_ws_stack_push_negative_004
    type: ws_io
    path: stack/push_negative_004
    comment: "Push negative number (-100) and output"

  - name: test_ws_stack_push_zero_001
    type: ws_io
    path: stack/push_zero_001
    comment: "Push zero and output"

  - name: test_ws_stack_dup_001
    type: ws_io
    path: stack/dup_001
    comment: "Duplicate top item"

  - name: test_ws_stack_swap_001
    type: ws_io
    path: stack/swap_001
    comment: "Swap top two items"

  - name: test_ws_stack_discard_001
    type: ws_io
    path: stack/discard_001
    comment: "Discard top item"

  - name: test_ws_stack_copy_001
    type: ws_io
    path: stack/copy_001
    comment: "Copy nth item to top"

  # Arithmetic
  - name: test_ws_arith_add_001
    type: ws_io
    path: arith/add_001
    comment: "Addition"

  - name: test_ws_arith_sub_001
    type: ws_io
    path: arith/sub_001
    comment: "Subtraction"

  - name: test_ws_arith_mul_001
    type: ws_io
    path: arith/mul_001
    comment: "Multiplication"

  - name: test_ws_arith_div_001
    type: ws_io
    path: arith/div_001
    comment: "Integer division"

  - name: test_ws_arith_mod_001
    type: ws_io
    path: arith/mod_001
    comment: "Modulo"

  - name: test_ws_arith_combined_001
    type: ws_io
    path: arith/combined_001
    comment: "Combined arithmetic"

  - name: test_ws_arith_negative_add_001
    type: ws_io
    path: arith/negative_add_001
    comment: "Addition with negative numbers (-5 + 3)"

  - name: test_ws_arith_negative_sub_001
    type: ws_io
    path: arith/negative_sub_001
    comment: "Subtraction resulting in negative (5 - 8)"

  - name: test_ws_arith_negative_mul_001
    type: ws_io
    path: arith/negative_mul_001
    comment: "Multiplication with negative (-3 * 4)"

  - name: test_ws_arith_mixed_add_001
    type: ws_io
    path: arith/mixed_add_001
    comment: "Addition of positive and negative (10 + -3)"

  - name: test_ws_arith_negative_div_001
    type: ws_io
    path: arith/negative_div_001
    comment: "Division with negative (-10 / 3)"

  - name: test_ws_arith_negative_mod_001
    type: ws_io
    path: arith/negative_mod_001
    comment: "Modulo with negative (-17 % 5)"

  # Heap
  - name: test_ws_heap_store_retrieve_001
    type: ws_io
    path: heap/store_retrieve_001
    comment: "Store and retrieve"

  - name: test_ws_heap_multiple_addr_001
    type: ws_io
    path: heap/multiple_addr_001
    comment: "Multiple heap addresses"

  # Flow control
  - name: test_ws_flow_jump_001
    type: ws_io
    path: flow/jump_001
    comment: "Unconditional jump"

  - name: test_ws_flow_jump_if_zero_true_001
    type: ws_io
    path: flow/jump_if_zero_true_001
    comment: "JumpIfZero with zero value"

  - name: test_ws_flow_jump_if_zero_false_001
    type: ws_io
    path: flow/jump_if_zero_false_001
    comment: "JumpIfZero with non-zero value"

  - name: test_ws_flow_jump_if_neg_true_001
    type: ws_io
    path: flow/jump_if_neg_true_001
    comment: "JumpIfNegative with negative value"

  - name: test_ws_flow_jump_if_neg_false_001
    type: ws_io
    path: flow/jump_if_neg_false_001
    comment: "JumpIfNegative with positive value"

  - name: test_ws_flow_call_return_001
    type: ws_io
